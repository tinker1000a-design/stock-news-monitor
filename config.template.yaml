# ============================================================
# 股票新闻监控系统 · 配置模板
# 部署方法：复制本文件为 config.yaml，再按 BOOTSTRAP.md 第 2 节填写。
# 真实 config.yaml 含个人路径，不要提交到 git。
# ============================================================

system: stock-news-monitor
version: 0.2

# ---- 用户画像：首跑问卷（BOOTSTRAP 第 2 节）的答案写在这里 ----
profile:
  strategy: ""          # value=长期价值 | swing=中线波段 | spec=短线投机 | mixed=混合
  info_rhythm: ""       # intraday=盘中 | daily_close=每日收盘 | weekly=每周
  focus_rank: []        # 关注面排序，如 [资金面, 情绪面, 政策面]
  concentration: ""     # deep=重仓少数深挖 | wide=分散跟踪
  confirmed: false      # 用户已确认画像后置 true；false 时报告标注"默认假设画像"

# ---- 画像预设：profile.strategy 激活对应段，可被用户显式要求覆盖 ----
presets:
  value:                # A 长期价值
    dimension_focus: [long, mid]
    extra_column: "估值锚点（PE/PB 分位+口径标注）"
    thesis_window: "季报/年报节点"
    mute_dimensions: [游资龙虎榜]
    report_depth: 深挖
  swing:                # B 中线波段
    dimension_focus: [short, mid]
    focus_signals: [资金流向, 事件催化, 回调买点]
    thesis_window: "1-4 周"
    report_depth: 均衡
  spec:                 # C 短线投机
    dimension_focus: [short]
    focus_signals: [情绪周期, 连板梯队, 龙虎榜]
    thesis_window: "1-5 日"
    noise_warn_threshold: 0.3     # 短线信息噪声高，未核实占比警告线下调
    requires_intraday: true       # 无盘中数据源必须明示降级
  mixed: {}             # D 混合：按 stocks[].style_override 逐标的激活

vault:
  path: ""            # 留空则由 AI 按自动发现逻辑定位/创建（见 BOOTSTRAP 2.1）
  watch_dirs:
    - 个股
    - 事件
    - 行业
    - 主题
    - 日报
    - 周报
    - 月报
    - 命题登记

# ---- 标的注册表：扩容唯一入口，新股票往这里加 ----
stocks: []            # 示例：
  # - code: "688825"
  #   name: "长鑫科技"
  #   alias: ["CXMT"]
  #   priority: high            # 仅影响排序/篇幅，不影响结论
  #   industry: "存储芯片产业链"
  #   themes: ["AI内存国产替代"]
  #   style_override: swing     # 仅 profile.strategy=mixed 时生效，逐标的指定 value/swing/spec

# ---- 分析维度：可增删改，模板用 {{dimensions}} 渲染 ----
dimensions:
  - id: short
    label: "短期"
    window: "1-5 交易日"
  - id: mid
    label: "中期"
    window: "1-3 个月"
  - id: long
    label: "长期"
    window: "1 年以上"

# ---- Obsidian 双链的五个关联维度 ----
link_dimensions: [产业链, 同题材, 竞品, 因果链, 资金机构]

# ---- 调度：改这里后需同步更新 automation ----
schedules:
  daily:
    rrule: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;BYHOUR=16;BYMINUTE=5"
  weekly:
    rrule: "FREQ=WEEKLY;BYDAY=FR;BYHOUR=15;BYMINUTE=30"
  monthly:
    rrule: "FREQ=MONTHLY;BYMONTHDAY=-1;BYHOUR=16;BYMINUTE=30"

# ---- 用户意图对齐记忆：设计见 INTENT.md，仅负反馈触发，其余轮次零动作 ----
intent_memory:
  enabled: true
  dir: ".monitor/intent"      # 点目录：在 vault 内但图谱不渲染
  memory_file: "MEMORY.md"    # 意图对齐主档（≤3000 字滚动维护）
  daily_summary: true         # 触发轮摘要按日追加，30 天前蒸馏进主档
  max_chars: 3000

# ---- 微信推送层：设计见 PUSH.md；webhook_url 视同密码，只写进真实 config.yaml ----
push:
  channel: ""                 # wecom_robot | serverchan | wxpusher | none（个人微信走 serverchan/wxpusher，见 PUSH.md）
  webhook_url: ""             # wecom_robot 完整 webhook 地址 / serverchan SendKey
  push_targets: [daily, weekly, monthly]
  digest_max_chars: 1200
  retry: 2

# ---- 阈值 ----
thresholds:
  evidence_unverified_ratio_warn: 0.4
  similarity_repeat_warn: 0.8
  consecutive_falsified_demote: 3

# ---- 客观性红线（AI 不可豁免）----
anti_sycophancy:
  cold_channel: true
  mandatory_contra: true
  wording_blacklist:
    - "完全支持"
    - "最硬证据"
    - "核完数据"
    - "铁证"
    - "已经不用猜了"
